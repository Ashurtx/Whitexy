<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Apps</title>
    <style>
        :root {
            --accent: #00b85c;
            --accent-dark: #009a4d;
            --accent-light: #00ff8c;
            --accent-rgb: 0, 184, 92;
            --bg: #0d1117;
            --card-bg: #161b22;
            --card-inner: #1c2128;
            --border-soft: rgba(255, 255, 255, 0.06);
            --border-mid: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --text-dim: #6e7681;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 90px 14px 30px 14px;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* ---------- FIXED SEARCH BAR ---------- */
        .search-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 14px 12px 14px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid var(--border-soft);
            transition: background 0.6s ease, border-color 0.6s ease;
        }

        .search-bar {
            width: 100%;
            max-width: 412px;
            background: var(--card-inner);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 8px;
            border: 1px solid var(--border-mid);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.25s ease,
                        border-color 0.25s ease,
                        background 0.6s ease;
            position: relative;
        }

        .search-bar.bounce {
            animation: searchBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes searchBounce {
            0%   { transform: scale(1); }
            35%  { transform: scale(1.06); }
            70%  { transform: scale(0.97); }
            100% { transform: scale(1); }
        }

        .search-bar.focused {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            stroke: var(--text-sub);
            flex-shrink: 0;
            transition: stroke 0.25s ease;
        }

        .search-bar.focused .search-icon {
            stroke: var(--accent);
        }

        .search-input-wrap {
            flex: 1;
            position: relative;
            height: 22px;
            overflow: hidden;
        }

        #searchInput {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            letter-spacing: 0.2px;
        }

        .random-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            color: var(--text-dim);
            font-size: 15px;
            font-weight: 500;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        .random-placeholder.hidden {
            opacity: 0;
        }

        .random-placeholder .cursor {
            display: inline-block;
            width: 1.5px;
            height: 16px;
            background: var(--text-dim);
            margin-left: 2px;
            animation: blink 0.9s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .clear-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #30363d;
            border: none;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .clear-btn:hover { background: #484f58; }
        .clear-btn:active { transform: scale(0.9); }
        .clear-btn svg { width: 10px; height: 10px; stroke: #c9d1d9; }
        .clear-btn.show { display: flex; }

        /* ---------- SUGGESTIONS ---------- */
        .suggestions {
            position: fixed;
            top: 74px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            width: calc(100% - 28px);
            max-width: 412px;
            background: var(--card-inner);
            border-radius: 14px;
            border: 1px solid var(--border-mid);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
            max-height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .suggestions.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            animation: sugFade 0.3s ease forwards;
            opacity: 0;
            transform: translateX(-8px);
        }

        @keyframes sugFade {
            to { opacity: 1; transform: translateX(0); }
        }

        .suggestion-item:hover,
        .suggestion-item:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .suggestion-item:not(:last-child) {
            border-bottom: 1px solid var(--border-soft);
        }

        .suggestion-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            object-fit: cover;
            background: #21262d;
            flex-shrink: 0;
        }

        .suggestion-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .suggestion-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-size {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .suggestion-install {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            text-decoration: none;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .suggestion-install:active {
            transform: scale(0.92);
            background: var(--accent-dark);
        }

        /* ---------- MAIN GRID ---------- */
        .container {
            width: 100%;
            max-width: 440px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* ---------- APP CARD ---------- */
        .app-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 12px 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1.5px solid var(--border-soft);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(25px) scale(0.95);
            animation: cardFadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background 0.5s ease,
                        border-color 0.4s ease,
                        box-shadow 0.4s ease;
            position: relative;
            cursor: pointer;
            isolation: isolate;
        }

        @keyframes cardFadeIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- SELECTED STATE (WHITE + POP) ---------- */
        .app-card.selected {
            background: #ffffff;
            border-color: rgba(var(--accent-rgb), 0.6);
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55),
                        0 0 0 3px rgba(var(--accent-rgb), 0.18);
            z-index: 5;
            animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            0%   { transform: translateY(0) scale(1); }
            40%  { transform: translateY(-14px) scale(1.07); }
            70%  { transform: translateY(-8px) scale(1.03); }
            100% { transform: translateY(-10px) scale(1.05); }
        }

        .app-card.selected .app-name { color: #0d1117; }
        .app-card.selected .app-size { color: #57606a; }
        .app-card.selected .icon-wrap {
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }
        .app-card.selected .install-btn {
            background: #0d1117;
            color: #ffffff;
        }
        .app-card.selected .install-btn:hover {
            background: #21262d;
        }

        /* ---------- BORDER LIGHT LEAK (OUTSIDE) ---------- */
        /* Outer glowing layer — positioned OUTSIDE the card, behind it */
        .app-card .border-leak {
            position: absolute;
            inset: -3px;
            border-radius: 23px;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .app-card.border-glow .border-leak {
            opacity: 1;
        }

        /* Rotating conic gradient with blur for glow */
        .app-card .border-leak::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                rgba(var(--accent-rgb), 0.05) 60deg,
                rgba(var(--accent-rgb), 0.6) 95deg,
                var(--accent-light) 110deg,
                rgba(var(--accent-rgb), 0.6) 125deg,
                rgba(var(--accent-rgb), 0.05) 160deg,
                transparent 190deg,
                transparent 360deg
            );
            filter: blur(8px);
            animation: borderRotate 1.6s linear;
        }

        /* Sharp inner line on the border */
        .app-card .border-leak::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 40deg,
                rgba(var(--accent-rgb), 0.2) 75deg,
                var(--accent-light) 110deg,
                rgba(var(--accent-rgb), 0.2) 145deg,
                transparent 180deg,
                transparent 360deg
            );
            animation: borderRotate 1.6s linear;
        }

        @keyframes borderRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Inner mask — hides center, keeps only the border ring visible */
        .app-card .border-mask {
            position: absolute;
            inset: 1.5px;
            border-radius: 19px;
            background: var(--card-bg);
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.5s ease;
        }

        .app-card.border-glow .border-mask {
            opacity: 1;
        }

        .app-card.selected .border-mask {
            background: #ffffff;
        }

        /* Ensure all direct children stay above mask */
        .app-card > *:not(.border-leak):not(.border-mask) {
            position: relative;
            z-index: 1;
        }

        /* ---------- ICON ---------- */
        .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 10px;
            background-color: #21262d;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon-wrap::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 60%;
            height: 200%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 35%,
                rgba(255, 255, 255, 0.75) 50%,
                rgba(255, 255, 255, 0) 65%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0;
            z-index: 2;
        }

        .icon-wrap.shine::after {
            animation: shineSweep 1.1s ease-in-out;
        }

        @keyframes shineSweep {
            0%   { left: -150%; opacity: 0; }
            15%  { opacity: 1; }
            50%  { opacity: 1; }
            100% { left: 200%; opacity: 0; }
        }

        .app-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .app-card:hover .icon-wrap { transform: scale(1.08) rotate(-3deg); }
        .app-card:hover .app-icon { transform: scale(1.1); }
        .app-card:active .icon-wrap { transform: scale(0.95); }

        .app-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            letter-spacing: -0.2px;
            margin-bottom: 4px;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            transition: color 0.4s ease;
        }

        .app-size {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 12px;
            transition: color 0.4s ease;
        }

        /* ---------- INSTALL BUTTON ---------- */
        .install-btn {
            background: var(--accent);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 0;
            width: 100%;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            letter-spacing: 0.2px;
            transition: transform 0.2s ease, background 0.4s ease, color 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .install-btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .install-btn:active { transform: scale(0.94); }

        .install-btn.btn-shine::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.55) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-20deg);
            animation: btnShineSweep 1.2s ease-in-out;
            pointer-events: none;
        }

        @keyframes btnShineSweep {
            0%   { left: -120%; }
            100% { left: 220%; }
        }

        /* ---------- SCROLL REVEAL ---------- */
        .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .suggestions::-webkit-scrollbar { width: 4px; }
        .suggestions::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        @media (max-width: 360px) {
            body { padding: 88px 10px 24px 10px; }
            .container { gap: 10px; }
            .app-card { padding: 14px 10px 12px 10px; border-radius: 18px; }
            .icon-wrap { width: 60px; height: 60px; border-radius: 15px; }
            .app-name { font-size: 12px; min-height: 30px; }
            .app-size { font-size: 10px; }
            .install-btn { font-size: 12px; padding: 7px 0; }
            .suggestions { top: 70px; }
        }
    </style>
</head>
<body>

    <!-- FIXED SEARCH BAR -->
    <div class="search-wrapper">
        <div class="search-bar" id="searchBar">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <div class="search-input-wrap">
                <input type="text" id="searchInput" autocomplete="off" spellcheck="false">
                <div class="random-placeholder" id="randomPlaceholder">
                    <span id="placeholderText"></span><span class="cursor"></span>
                </div>
            </div>
            <button class="clear-btn" id="clearBtn" aria-label="Clear">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="suggestions" id="suggestions"></div>

    <div class="container" id="appContainer"></div>

    <script>
        // ============================================
        // RANDOM THEME
        // ============================================
        const THEMES = [
            { accent: '#00b85c', accentDark: '#009a4d', accentLight: '#00ff8c', accentRgb: '0, 184, 92' },
            { accent: '#2f81f7', accentDark: '#1f6feb', accentLight: '#79c0ff', accentRgb: '47, 129, 247' },
            { accent: '#f85149', accentDark: '#da3633', accentLight: '#ff7b72', accentRgb: '248, 81, 73' }
        ];
        const chosenTheme = THEMES[Math.floor(Math.random() * THEMES.length)];
        const root = document.documentElement;
        root.style.setProperty('--accent', chosenTheme.accent);
        root.style.setProperty('--accent-dark', chosenTheme.accentDark);
        root.style.setProperty('--accent-light', chosenTheme.accentLight);
        root.style.setProperty('--accent-rgb', chosenTheme.accentRgb);

        let metaTheme = document.querySelector('meta[name="theme-color"]');
        if (!metaTheme) {
            metaTheme = document.createElement('meta');
            metaTheme.name = 'theme-color';
            document.head.appendChild(metaTheme);
        }
        metaTheme.content = chosenTheme.accent;

        // ============================================
        // APP DATA
        // ============================================
        const apps = [
            { name: "FREE FIRE 2018", size: "350 MB", icon: "freefire2018.png" },
            { name: "FREE FIRE 2022", size: "420 MB", icon: "freefire2022.png" },
            { name: "FREE FIRE VIP PROXY", size: "85 MB", icon: "freefirevipproxy.png" },
            { name: "DARK AURA PANEL", size: "45 MB", icon: "darkaura.png" },
            { name: "MACRO SPACE X PANEL", size: "38 MB", icon: "macrospacex.png" },
            { name: "FREESTYLE PANEL", size: "42 MB", icon: "freestyle.png" },
            { name: "CLT PANEL", size: "36 MB", icon: "cltpanel.png" },
            { name: "RUSH MACRO PANEL", size: "40 MB", icon: "rushmacro.png" },
            { name: "VOLPPSENSI PANEL", size: "33 MB", icon: "volppsensi.png" },
            { name: "SADX PANEL", size: "30 MB", icon: "sadx.png" },
            { name: "HEXAGON PANEL", size: "35 MB", icon: "hexagon.png" },
            { name: "BLUE MACRO PANEL", size: "39 MB", icon: "bluemacro.png" }
        ];

        const REDIRECT_URL = "https://earnsio.cc/r/whitex";
        const container = document.getElementById('appContainer');
        const iconWraps = [];
        const appCards = [];
        const installBtns = [];

        // ============================================
        // BUILD MAIN GRID
        // ============================================
        apps.forEach((app, index) => {
            const card = document.createElement('div');
            card.className = 'app-card reveal';
            card.style.animationDelay = `${index * 0.06}s`;
            card.dataset.index = index;

            // Border leak layers (outside card via z-index: -1)
            const borderLeak = document.createElement('div');
            borderLeak.className = 'border-leak';
            card.appendChild(borderLeak);

            const borderMask = document.createElement('div');
            borderMask.className = 'border-mask';
            card.appendChild(borderMask);

            const iconWrap = document.createElement('div');
            iconWrap.className = 'icon-wrap';
            iconWraps.push(iconWrap);

            const img = document.createElement('img');
            img.className = 'app-icon';
            img.src = `images/${app.icon}`;
            img.alt = app.name;
            img.loading = "lazy";
            img.onerror = function() {
                this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="%238b949e" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="3"/></svg>';
            };
            iconWrap.appendChild(img);

            const nameH3 = document.createElement('h3');
            nameH3.className = 'app-name';
            nameH3.textContent = app.name;

            const sizeP = document.createElement('p');
            sizeP.className = 'app-size';
            sizeP.textContent = app.size;

            const installLink = document.createElement('a');
            installLink.className = 'install-btn';
            installLink.href = REDIRECT_URL;
            installLink.target = "_blank";
            installLink.rel = "noopener";
            installLink.textContent = "Install";

            // Install button pe click → card select na ho, direct redirect
            installLink.addEventListener('click', (e) => {
                e.stopPropagation();
                // Redirect explicitly
                window.open(REDIRECT_URL, '_blank');
                e.preventDefault();
            });

            card.appendChild(iconWrap);
            card.appendChild(nameH3);
            card.appendChild(sizeP);
            card.appendChild(installLink);

            // Card click → select (white + bounce pop)
            card.addEventListener('click', () => {
                appCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
            });

            container.appendChild(card);
            appCards.push(card);
            installBtns.push(installLink);
        });

        // ============================================
        // SEARCH BAR
        // ============================================
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const placeholderEl = document.getElementById('randomPlaceholder');
        const placeholderText = document.getElementById('placeholderText');
        const suggestionsBox = document.getElementById('suggestions');

        // ---- Placeholder typing ----
        let placeholderIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typingTimer;
        let placeholderPaused = false; // when search bar is clicked

        function typePlaceholder() {
            if (placeholderPaused || searchInput.value.length > 0) {
                typingTimer = setTimeout(typePlaceholder, 300);
                return;
            }
            const currentApp = apps[placeholderIndex].name;
            if (!isDeleting) {
                charIndex++;
                placeholderText.textContent = currentApp.substring(0, charIndex);
                if (charIndex === currentApp.length) {
                    isDeleting = true;
                    typingTimer = setTimeout(typePlaceholder, 1600);
                    return;
                }
                typingTimer = setTimeout(typePlaceholder, 65);
            } else {
                charIndex--;
                placeholderText.textContent = currentApp.substring(0, charIndex);
                if (charIndex === 0) {
                    isDeleting = false;
                    placeholderIndex = (placeholderIndex + 1) % apps.length;
                    typingTimer = setTimeout(typePlaceholder, 300);
                    return;
                }
                typingTimer = setTimeout(typePlaceholder, 30);
            }
        }
        typePlaceholder();

        function updatePlaceholderVisibility() {
            if (searchInput.value.length > 0 || placeholderPaused) {
                placeholderEl.classList.add('hidden');
            } else {
                placeholderEl.classList.remove('hidden');
            }
        }

        // ---- Search bar click → stop animation, bounce ----
        searchBar.addEventListener('click', () => {
            searchBar.classList.remove('bounce');
            void searchBar.offsetWidth;
            searchBar.classList.add('bounce');

            // Stop placeholder animation immediately
            placeholderPaused = true;
            placeholderEl.classList.add('hidden');

            searchInput.focus();
        });

        searchInput.addEventListener('focus', () => {
            searchBar.classList.add('focused');
            placeholderPaused = true;
            placeholderEl.classList.add('hidden');
        });

        searchInput.addEventListener('blur', () => {
            searchBar.classList.remove('focused');
            setTimeout(() => {
                suggestionsBox.classList.remove('show');
            }, 200);

            // If input is empty and user didn't click, resume animation
            if (searchInput.value.length === 0) {
                placeholderPaused = false;
                updatePlaceholderVisibility();
            }
        });

        // ---- Input ----
        searchInput.addEventListener('input', (e) => {
            const value = e.target.value;
            searchBar.classList.remove('bounce');
            void searchBar.offsetWidth;
            searchBar.classList.add('bounce');

            clearBtn.classList.toggle('show', value.length > 0);
            updatePlaceholderVisibility();
            updateSuggestions(value);
        });

        clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            searchInput.value = '';
            clearBtn.classList.remove('show');
            placeholderPaused = false;
            updatePlaceholderVisibility();
            updateSuggestions('');
            searchInput.focus();
        });

        // ---- Suggestions ----
        function updateSuggestions(query) {
            const q = query.trim().toLowerCase();
            suggestionsBox.innerHTML = '';

            if (q.length === 0) {
                suggestionsBox.classList.remove('show');
                return;
            }

            // 1) Matching apps
            const matched = apps.filter(a => a.name.toLowerCase().includes(q));

            matched.slice(0, 5).forEach((app, i) => {
                const item = buildSuggestionItem(app, i);
                suggestionsBox.appendChild(item);
            });

            // 2) If no exact match, OR query itself not in list — show a "custom" item
            const exactMatch = apps.some(a => a.name.toLowerCase() === q);
            if (!exactMatch) {
                const customItem = document.createElement('div');
                customItem.className = 'suggestion-item';
                customItem.style.animationDelay = `${matched.length * 0.04}s`;
                customItem.style.background = 'rgba(var(--accent-rgb), 0.08)';

                const iconDiv = document.createElement('div');
                iconDiv.className = 'suggestion-icon';
                iconDiv.style.display = 'flex';
                iconDiv.style.alignItems = 'center';
                iconDiv.style.justifyContent = 'center';
                iconDiv.style.fontSize = '18px';
                iconDiv.style.background = 'var(--accent)';
                iconDiv.style.color = '#fff';
                iconDiv.textContent = '⬇';

                const info = document.createElement('div');
                info.className = 'suggestion-info';
                const n = document.createElement('div');
                n.className = 'suggestion-name';
                n.textContent = query.trim().toUpperCase();
                const s = document.createElement('div');
                s.className = 'suggestion-size';
                s.textContent = 'Tap to install';
                info.appendChild(n);
                info.appendChild(s);

                const inst = document.createElement('a');
                inst.className = 'suggestion-install';
                inst.href = REDIRECT_URL;
                inst.target = '_blank';
                inst.textContent = 'Install';
                inst.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(REDIRECT_URL, '_blank');
                    e.preventDefault();
                });

                customItem.appendChild(iconDiv);
                customItem.appendChild(info);
                customItem.appendChild(inst);

                // Whole row click → redirect
                customItem.addEventListener('click', () => {
                    window.open(REDIRECT_URL, '_blank');
                });

                suggestionsBox.appendChild(customItem);
            }

            suggestionsBox.classList.add('show');
        }

        function buildSuggestionItem(app, i) {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.style.animationDelay = `${i * 0.04}s`;

            const img = document.createElement('img');
            img.className = 'suggestion-icon';
            img.src = `images/${app.icon}`;
            img.alt = app.name;
            img.onerror = function() {
                this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="%238b949e" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="3"/></svg>';
            };

            const info = document.createElement('div');
            info.className = 'suggestion-info';
            const n = document.createElement('div');
            n.className = 'suggestion-name';
            n.textContent = app.name;
            const s = document.createElement('div');
            s.className = 'suggestion-size';
            s.textContent = app.size;
            info.appendChild(n);
            info.appendChild(s);

            const inst = document.createElement('a');
            inst.className = 'suggestion-install';
            inst.href = REDIRECT_URL;
            inst.target = '_blank';
            inst.textContent = 'Install';
            inst.addEventListener('click', (e) => {
                e.stopPropagation();
                window.open(REDIRECT_URL, '_blank');
                e.preventDefault();
            });

            item.appendChild(img);
            item.appendChild(info);
            item.appendChild(inst);

            item.addEventListener('click', () => {
                searchInput.value = app.name;
                clearBtn.classList.add('show');
                updatePlaceholderVisibility();
                suggestionsBox.classList.remove('show');
            });

            return item;
        }

        // ============================================
        // SHINE + BORDER GLOW
        // ============================================
        function triggerShine(index) {
            const icon = iconWraps[index];
            const card = appCards[index];
            const btn = installBtns[index];
            if (!icon || !card) return;

            icon.classList.remove('shine');
            void icon.offsetWidth;
            icon.classList.add('shine');

            card.classList.remove('border-glow');
            void card.offsetWidth;
            card.classList.add('border-glow');

            btn.classList.remove('btn-shine');

            setTimeout(() => {
                icon.classList.remove('shine');
                card.classList.remove('border-glow');
            }, 1700);
        }

        function triggerButtonShine() {
            const total = installBtns.length;
            const idx = Math.floor(Math.random() * total);
            const card = appCards[idx];
            if (card.classList.contains('border-glow')) return;

            const btn = installBtns[idx];
            btn.classList.remove('btn-shine');
            void btn.offsetWidth;
            btn.classList.add('btn-shine');
            setTimeout(() => btn.classList.remove('btn-shine'), 1300);
        }

        function randomShineBurst() {
            const total = iconWraps.length;
            const count = Math.floor(Math.random() * 3) + 1;
            const used = new Set();
            for (let i = 0; i < count; i++) {
                let r;
                let attempts = 0;
                do {
                    r = Math.floor(Math.random() * total);
                    attempts++;
                } while (used.has(r) && attempts < 10);
                used.add(r);
                triggerShine(r);
            }
        }

        function scheduleNextShine() {
            const delay = Math.floor(Math.random() * 1700) + 800;
            setTimeout(() => {
                randomShineBurst();
                scheduleNextShine();
            }, delay);
        }

        function scheduleButtonShine() {
            const delay = Math.floor(Math.random() * 1500) + 700;
            setTimeout(() => {
                triggerButtonShine();
                scheduleButtonShine();
            }, delay);
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                randomShineBurst();
                scheduleNextShine();
                scheduleButtonShine();
            }, 800);
        });

        let lastScrollShine = 0;
        window.addEventListener('scroll', () => {
            const now = Date.now();
            if (now - lastScrollShine < 400) return;
            lastScrollShine = now;
            setTimeout(() => randomShineBurst(), 80);
        }, { passive: true });

        // ============================================
        // SCROLL REVEAL
        // ============================================
        const revealElements = document.querySelectorAll('.reveal');
        const revealOnScroll = () => {
            const wh = window.innerHeight;
            revealElements.forEach(el => {
                const top = el.getBoundingClientRect().top;
                if (top < wh - 80) el.classList.add('active');
                else el.classList.remove('active');
            });
        };
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    revealOnScroll();
                    ticking = false;
                });
                ticking = true;
            }
        });
        window.addEventListener('load', () => setTimeout(revealOnScroll, 100));
        revealOnScroll();
    </script>

</body>
</html>
